<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ed1765">
  <title>A STYLE | المتجر</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;font-family:Tahoma,Arial,sans-serif;background:#fff7fa;color:#171717}
    body{overflow-x:hidden}
    button,input,select,textarea{font-family:inherit}
    button{cursor:pointer}
    img{max-width:100%;display:block}
    .hidden{display:none!important}

    :root{
      --pink:#ed1765;
      --pink2:#ff4f91;
      --light:#fff0f6;
      --border:#eee;
      --dark:#171717;
    }

    .top-strip{height:5px;background:var(--pink)}
    header{
      position:sticky;top:0;z-index:50;background:#fff;
      border-bottom:1px solid #eee;
      box-shadow:0 3px 18px rgba(0,0,0,.05)
    }
    .header-inner{
      max-width:1250px;margin:auto;padding:14px 18px;
      display:flex;align-items:center;gap:15px;justify-content:space-between
    }
    .brand{display:flex;align-items:center;gap:10px;min-width:150px}
    .brand-logo{
      width:48px;height:48px;border-radius:14px;background:var(--pink);color:#fff;
      display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px
    }
    .brand h1{font-size:21px;margin:0}
    .brand small{color:#888;display:block;margin-top:2px}
    .header-actions{display:flex;gap:9px}
    .icon-btn{
      width:44px;height:44px;border:1px solid #eee;background:#fff;border-radius:13px;
      font-size:20px;display:flex;align-items:center;justify-content:center;position:relative
    }
    .count{
      position:absolute;top:-5px;left:-5px;background:var(--pink);color:#fff;
      min-width:20px;height:20px;border-radius:20px;font-size:11px;display:flex;
      align-items:center;justify-content:center;font-weight:bold
    }

    .hero{
      max-width:1250px;margin:18px auto 0;padding:0 18px
    }
    .hero-box{
      background:linear-gradient(135deg,#fff0f6,#fff);
      border:1px solid #ffd4e4;border-radius:24px;padding:28px 24px;
      display:flex;align-items:center;justify-content:space-between;gap:20px
    }
    .hero h2{margin:0 0 8px;font-size:28px}
    .hero p{margin:0;color:#777;line-height:1.8}
    .hero-badge{font-size:48px}

    .container{max-width:1250px;margin:auto;padding:0 18px 50px}
    .search-row{display:flex;gap:10px;margin:20px 0 14px}
    .search-box{
      flex:1;background:#fff;border:1px solid #e5e5e5;border-radius:14px;
      display:flex;align-items:center;padding:0 14px
    }
    .search-box input{width:100%;border:0;outline:0;padding:14px 8px;font-size:15px;background:transparent}
    .refresh-btn{border:0;background:var(--dark);color:#fff;border-radius:14px;padding:0 17px;font-weight:bold}

    .categories{display:flex;gap:8px;overflow:auto;padding:3px 0 12px;scrollbar-width:none}
    .categories::-webkit-scrollbar{display:none}
    .cat{
      white-space:nowrap;border:1px solid #eee;background:#fff;border-radius:30px;
      padding:10px 16px;font-weight:bold;color:#666
    }
    .cat.active{background:var(--pink);color:#fff;border-color:var(--pink)}

    .section-head{display:flex;align-items:center;justify-content:space-between;margin:16px 0}
    .section-head h2{margin:0;font-size:23px}
    .section-head span{color:#888;font-size:13px}

    .status{
      background:#fff;border:1px solid #eee;border-radius:14px;padding:13px 15px;
      margin-bottom:14px;color:#666;font-size:13px
    }

    .products{
      display:grid;grid-template-columns:repeat(4,1fr);gap:16px
    }
    .card{
      background:#fff;border:1px solid #eee;border-radius:18px;overflow:hidden;
      position:relative;transition:.2s;box-shadow:0 5px 20px rgba(0,0,0,.035)
    }
    .card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.08)}
    .fav{
      position:absolute;top:10px;left:10px;z-index:2;width:38px;height:38px;border-radius:50%;
      border:0;background:rgba(255,255,255,.94);font-size:18px
    }
    .photo{aspect-ratio:1/1;background:#f7f7f7;overflow:hidden}
    .photo img{width:100%;height:100%;object-fit:cover}
    .card-body{padding:13px}
    .cat-name{font-size:11px;color:#999;margin-bottom:5px}
    .name{font-weight:bold;line-height:1.5;min-height:43px}
    .price{color:var(--pink);font-size:19px;font-weight:900;margin-top:7px}
    .add-btn{
      width:100%;border:0;background:var(--dark);color:#fff;border-radius:11px;
      padding:11px;margin-top:10px;font-weight:bold
    }
    .add-btn:hover{background:#333}

    .empty{
      grid-column:1/-1;background:#fff;border:1px dashed #ddd;border-radius:18px;
      padding:55px 20px;text-align:center;color:#777
    }
    .empty .emoji{font-size:42px;margin-bottom:10px}

    /* Drawer */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100}
    .drawer{
      position:fixed;right:0;top:0;bottom:0;width:min(520px,94vw);background:#fff;z-index:110;
      transform:translateX(105%);transition:.25s;display:flex;flex-direction:column;
      box-shadow:-10px 0 35px rgba(0,0,0,.18)
    }
    .drawer.open{transform:translateX(0)}
    .drawer-head{
      padding:19px;border-bottom:1px solid #eee;display:flex;align-items:center;
      justify-content:space-between
    }
    .drawer-head h2{margin:0}
    .close{width:42px;height:42px;border:0;background:#f5f5f5;border-radius:12px;font-size:23px}
    .cart-items{flex:1;overflow:auto;padding:15px}
    .cart-item{
      border:1px solid #eee;border-radius:14px;padding:10px;display:flex;gap:10px;
      margin-bottom:10px
    }
    .cart-item img{width:72px;height:72px;border-radius:11px;object-fit:cover;background:#eee}
    .cart-info{flex:1}
    .cart-info strong{display:block;line-height:1.5}
    .cart-meta{color:#777;font-size:12px;margin-top:4px;line-height:1.6}
    .cart-line{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:6px}
    .qty{display:flex;align-items:center;border:1px solid #ddd;border-radius:10px;overflow:hidden}
    .qty button{border:0;background:#fff;width:31px;height:31px;font-size:17px}
    .qty span{width:31px;text-align:center;font-weight:bold}
    .remove{border:0;background:#fff0f0;color:#c00025;border-radius:8px;padding:6px 8px;font-size:11px}
    .cart-foot{border-top:1px solid #eee;padding:17px}
    .total-row{display:flex;justify-content:space-between;font-size:18px;font-weight:bold;margin-bottom:12px}
    .total-row strong{color:var(--pink);font-size:22px}
    .wa-btn{
      width:100%;border:0;background:#20c66b;color:#fff;border-radius:14px;
      padding:15px;font-size:17px;font-weight:900
    }
    .clear-btn{
      width:100%;border:1px solid #ddd;background:#fff;color:#555;border-radius:12px;
      padding:10px;margin-top:8px
    }

    /* Modal */
    .modal-wrap{
      position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;padding:15px;
      display:flex;align-items:center;justify-content:center
    }
    .modal{
      width:min(850px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:22px
    }
    .modal-top{display:flex;justify-content:space-between;padding:15px;border-bottom:1px solid #eee}
    .modal-body{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:20px}
    .modal-image{border-radius:18px;overflow:hidden;background:#f7f7f7}
    .modal-image img{width:100%;aspect-ratio:1;object-fit:cover}
    .modal-info h2{margin:0 0 8px;font-size:25px}
    .modal-price{color:var(--pink);font-weight:900;font-size:25px;margin-bottom:14px}
    .desc{color:#666;line-height:1.9;font-size:14px;margin-bottom:14px}
    .label{font-weight:bold;font-size:13px;margin:15px 0 8px}
    .options{display:flex;flex-wrap:wrap;gap:7px}
    .option{
      border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 12px
    }
    .option.selected{border-color:var(--pink);background:var(--light);color:var(--pink);font-weight:bold}
    .modal-add{width:100%;border:0;background:var(--pink);color:#fff;border-radius:13px;padding:14px;font-weight:bold;margin-top:20px;font-size:16px}

    .toast{
      position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);
      background:#171717;color:#fff;padding:12px 18px;border-radius:12px;z-index:500;
      transition:.25s;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.2)
    }
    .toast.show{transform:translateX(-50%) translateY(0)}

    @media(max-width:1000px){.products{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:700px){
      .hero-box{padding:20px}.hero h2{font-size:22px}.hero-badge{font-size:35px}
      .products{grid-template-columns:repeat(2,1fr);gap:10px}
      .card-body{padding:10px}.name{font-size:14px}.price{font-size:17px}
      .modal-body{grid-template-columns:1fr;gap:15px}
    }
    @media(max-width:450px){
      .header-inner{padding:10px 12px}.brand h1{font-size:18px}.brand small{font-size:10px}
      .brand-logo{width:42px;height:42px}.icon-btn{width:40px;height:40px}
      .hero{padding:0 12px}.container{padding:0 12px 40px}
      .search-row{margin-top:13px}.refresh-btn{padding:0 12px}
      .products{gap:8px}.add-btn{font-size:12px;padding:10px}
      .modal-wrap{padding:7px}.modal{border-radius:16px}
    }
  </style>
</head>

<body>
  <div class="top-strip"></div>

  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo">A</div>
        <div>
          <h1>A STYLE</h1>
          <small>متجرنا الإلكتروني</small>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="favBtn" title="المفضلة">♡</button>
        <button class="icon-btn" id="cartBtn" title="السلة">
          🛒
          <span class="count" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-box">
      <div>
        <h2>🩷 أهلاً بيكي في A STYLE</h2>
        <p>اختاري منتجاتك، حددي التفاصيل، وضيفيها للسلة ثم أكدي الطلب على واتساب.</p>
      </div>
      <div class="hero-badge">🛍️</div>
    </div>
  </section>

  <main class="container">
    <div class="search-row">
      <div class="search-box">
        🔎
        <input id="searchInput" type="search" placeholder="دوري على قطعة...">
      </div>
      <button class="refresh-btn" id="refreshBtn">تحديث</button>
    </div>

    <div class="categories" id="categories"></div>

    <div class="section-head">
      <h2>أحدث المنتجات</h2>
      <span id="productCount">0 منتج</span>
    </div>

    <div id="status" class="status">جاري تحميل المنتجات...</div>
    <div class="products" id="products"></div>
  </main>

  <!-- Cart -->
  <div id="cartOverlay" class="overlay hidden"></div>
  <aside id="cartDrawer" class="drawer">
    <div class="drawer-head">
      <h2>السلة 🛒</h2>
      <button class="close" id="closeCart">×</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot">
      <div class="total-row">
        <span>الإجمالي النهائي:</span>
        <strong id="cartTotal">EGP 0</strong>
      </div>
      <button class="wa-btn" id="whatsappBtn">💬 تأكيد الطلب على واتساب</button>
      <button class="clear-btn" id="clearCart">إفراغ السلة</button>
    </div>
  </aside>

  <!-- Product Modal -->
  <div id="productModal" class="modal-wrap hidden">
    <div class="modal">
      <div class="modal-top">
        <strong>تفاصيل المنتج</strong>
        <button class="close" id="closeModal">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-image"><img id="modalImage" alt=""></div>
        <div class="modal-info">
          <h2 id="modalName"></h2>
          <div class="modal-price" id="modalPrice"></div>
          <div class="desc" id="modalDesc"></div>

          <div id="colorBox" class="hidden">
            <div class="label">اختاري اللون:</div>
            <div class="options" id="colorOptions"></div>
          </div>

          <div id="sizeBox" class="hidden">
            <div class="label">اختاري المقاس:</div>
            <div class="options" id="sizeOptions"></div>
          </div>

          <div class="label">الكمية:</div>
          <div class="qty" style="width:max-content">
            <button id="modalMinus">−</button>
            <span id="modalQty">1</span>
            <button id="modalPlus">+</button>
          </div>

          <button class="modal-add" id="modalAdd">إضافة للسلة 🛒</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

<script>
  /* =========================================================
     1) بيانات Supabase
     ========================================================= */

  const SUPABASE_URL = "https://atwpvvzxqqwcbyjsttwr.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_i9kMQbMAL5y-pkniTpftmw_6ab3_bB6";

  /* =========================================================
     2) أرقام واتساب الطلبات
        الموقع يبدّل بين الرقمين تلقائياً
     ========================================================= */

  const WHATSAPP_NUMBERS = [
    "201507540976",
    "201042032947"
  ];

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const state = {
    products: [],
    filtered: [],
    category: "الكل",
    search: "",
    cart: JSON.parse(localStorage.getItem("a_style_cart") || "[]"),
    favorites: JSON.parse(localStorage.getItem("a_style_favorites") || "[]"),
    modalProduct: null,
    modalQty: 1,
    modalColor: "",
    modalSize: ""
  };

  const $ = id => document.getElementById(id);

  function money(value){
    return "EGP " + Number(value || 0).toLocaleString("en-US");
  }

  function escapeHTML(value){
    return String(value ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function fallbackImage(){
    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="700" height="700">
        <rect width="100%" height="100%" fill="#171717"/>
        <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle"
              fill="white" font-size="65" font-family="Arial">A STYLE</text>
      </svg>
    `);
  }

  function showToast(text){
    const el = $("toast");
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }

  function parseList(value){
    if(value == null) return [];
    if(Array.isArray(value)) return value.map(String).filter(Boolean);

    if(typeof value === "object"){
      if(Array.isArray(value.items)) return value.items.map(String);
      return Object.values(value).map(String).filter(Boolean);
    }

    const s = String(value).trim();
    if(!s) return [];

    try{
      const parsed = JSON.parse(s);
      if(Array.isArray(parsed)) return parsed.map(String).filter(Boolean);
    }catch(e){}

    return s.split(/[,،|\/\n]+/).map(x => x.trim()).filter(Boolean);
  }

  function normalizeProduct(p){
    const image =
      p.image_url || p.imageUrl || p.image ||
      p.photo_url || p.photo || p.thumbnail ||
      fallbackImage();

    const price =
      p.price ?? p.sale_price ?? p.selling_price ??
      p.product_price ?? 0;

    const category =
      p.category_name || p.category ||
      p.category_title || p.type || "عام";

    const active =
      p.is_active ?? p.active ??
      (p.status ? String(p.status).toLowerCase() !== "inactive" : true);

    return {
      id: p.id,
      name: p.name || p.title || p.product_name || "منتج",
      price: Number(price) || 0,
      image,
      category: String(category || "عام"),
      description: p.description || p.details || p.short_description || "",
      colors: parseList(p.colors || p.color || p.available_colors),
      sizes: parseList(p.sizes || p.size || p.available_sizes),
      active
    };
  }

  async function loadProducts(){
    $("status").textContent = "جاري تحميل المنتجات...";
    $("status").classList.remove("hidden");

    try{
      /*
        لو جدول المنتجات عندك اسمه products، الكود يقرأه مباشرة.
        ويقبل أكثر من اسم شائع للأعمدة كما هو موضح في normalizeProduct().
      */
      const { data, error } = await db
        .from("products")
        .select("*")
        .order("created_at", { ascending:false });

      if(error) throw error;

      state.products = (data || [])
        .map(normalizeProduct)
        .filter(p => p.active);

      buildCategories();
      applyFilters();

      $("status").classList.add("hidden");
    }catch(error){
      console.error(error);
      $("status").innerHTML =
        "تعذر تحميل المنتجات من Supabase.<br>" +
        "<small>تأكدي أن جدول <b>products</b> موجود وأن سياسة القراءة العامة مفعّلة.</small>";
      $("products").innerHTML = `
        <div class="empty">
          <div class="emoji">⚠️</div>
          <div>لم يتم تحميل المنتجات.</div>
        </div>`;
    }
  }

  function buildCategories(){
    const cats = ["الكل", ...new Set(state.products.map(p => p.category).filter(Boolean))];

    $("categories").innerHTML = cats.map(cat => `
      <button class="cat ${state.category === cat ? "active" : ""}"
              onclick="selectCategory(${JSON.stringify(cat)})">
        ${escapeHTML(cat)}
      </button>
    `).join("");
  }

  window.selectCategory = function(cat){
    state.category = cat;
    buildCategories();
    applyFilters();
  };

  function applyFilters(){
    const q = state.search.trim().toLowerCase();

    state.filtered = state.products.filter(p => {
      const catOk = state.category === "الكل" || p.category === state.category;
      const text = (p.name + " " + p.category + " " + p.description).toLowerCase();
      return catOk && (!q || text.includes(q));
    });

    renderProducts();
  }

  function renderProducts(){
    $("productCount").textContent =
      `${state.filtered.length.toLocaleString("ar-EG")} منتج`;

    if(!state.filtered.length){
      $("products").innerHTML = `
        <div class="empty">
          <div class="emoji">📦</div>
          <div>لا توجد منتجات مطابقة للبحث.</div>
        </div>`;
      return;
    }

    $("products").innerHTML = state.filtered.map(p => {
      const fav = state.favorites.includes(String(p.id));
      return `
        <article class="card">
          <button class="fav" onclick="toggleFavorite('${escapeHTML(String(p.id))}')">
            ${fav ? "❤️" : "♡"}
          </button>

          <div class="photo" onclick="openProduct('${escapeHTML(String(p.id))}')">
            <img src="${escapeHTML(p.image)}"
                 alt="${escapeHTML(p.name)}"
                 onerror="this.src='${fallbackImage()}'">
          </div>

          <div class="card-body">
            <div class="cat-name">${escapeHTML(p.category)}</div>
            <div class="name">${escapeHTML(p.name)}</div>
            <div class="price">${money(p.price)}</div>
            <button class="add-btn" onclick="openProduct('${escapeHTML(String(p.id))}')">
              إضافة للسلة 🛒
            </button>
          </div>
        </article>
      `;
    }).join("");
  }

  window.toggleFavorite = function(id){
    id = String(id);
    if(state.favorites.includes(id)){
      state.favorites = state.favorites.filter(x => x !== id);
      showToast("تمت الإزالة من المفضلة");
    }else{
      state.favorites.push(id);
      showToast("تمت الإضافة للمفضلة ❤️");
    }
    localStorage.setItem("a_style_favorites", JSON.stringify(state.favorites));
    renderProducts();
  };

  $("favBtn").addEventListener("click", () => {
    if(!state.favorites.length){
      showToast("المفضلة فارغة ❤️");
      return;
    }
    const first = state.products.find(p => state.favorites.includes(String(p.id)));
    if(first) openProduct(String(first.id));
  });

  window.openProduct = function(id){
    const p = state.products.find(x => String(x.id) === String(id));
    if(!p) return;

    state.modalProduct = p;
    state.modalQty = 1;
    state.modalColor = p.colors[0] || "";
    state.modalSize = p.sizes[0] || "";

    $("modalImage").src = p.image;
    $("modalImage").onerror = () => $("modalImage").src = fallbackImage();
    $("modalName").textContent = p.name;
    $("modalPrice").textContent = money(p.price);
    $("modalDesc").textContent = p.description || "اختاري التفاصيل ثم أضيفي المنتج إلى السلة.";

    renderOptions();
    $("modalQty").textContent = state.modalQty;
    $("productModal").classList.remove("hidden");
  };

  function renderOptions(){
    const p = state.modalProduct;

    if(p.colors.length){
      $("colorBox").classList.remove("hidden");
      $("colorOptions").innerHTML = p.colors.map(c => `
        <button class="option ${state.modalColor === c ? "selected" : ""}"
                onclick="chooseColor(${JSON.stringify(c)})">
          ${escapeHTML(c)}
        </button>
      `).join("");
    }else{
      $("colorBox").classList.add("hidden");
      $("colorOptions").innerHTML = "";
    }

    if(p.sizes.length){
      $("sizeBox").classList.remove("hidden");
      $("sizeOptions").innerHTML = p.sizes.map(s => `
        <button class="option ${state.modalSize === s ? "selected" : ""}"
                onclick="chooseSize(${JSON.stringify(s)})">
          ${escapeHTML(s)}
        </button>
      `).join("");
    }else{
      $("sizeBox").classList.add("hidden");
      $("sizeOptions").innerHTML = "";
    }
  }

  window.chooseColor = function(c){
    state.modalColor = c;
    renderOptions();
  };

  window.chooseSize = function(s){
    state.modalSize = s;
    renderOptions();
  };

  $("modalMinus").addEventListener("click", () => {
    state.modalQty = Math.max(1, state.modalQty - 1);
    $("modalQty").textContent = state.modalQty;
  });

  $("modalPlus").addEventListener("click", () => {
    state.modalQty++;
    $("modalQty").textContent = state.modalQty;
  });

  $("modalAdd").addEventListener("click", () => {
    const p = state.modalProduct;
    if(!p) return;

    const key = [
      p.id,
      state.modalColor || "",
      state.modalSize || ""
    ].join("|");

    const existing = state.cart.find(x => x.key === key);

    if(existing){
      existing.qty += state.modalQty;
    }else{
      state.cart.push({
        key,
        id: p.id,
        name: p.name,
        price: p.price,
        image: p.image,
        color: state.modalColor,
        size: state.modalSize,
        qty: state.modalQty
      });
    }

    saveCart();
    closeProductModal();
    renderCart();
    openCart();
    showToast("تمت الإضافة للسلة 🛒");
  });

  function saveCart(){
    localStorage.setItem("a_style_cart", JSON.stringify(state.cart));
    updateCartCount();
  }

  function updateCartCount(){
    $("cartCount").textContent =
      state.cart.reduce((sum,item) => sum + Number(item.qty || 0), 0);
  }

  function renderCart(){
    updateCartCount();

    if(!state.cart.length){
      $("cartItems").innerHTML = `
        <div class="empty" style="padding:50px 15px">
          <div class="emoji">🛒</div>
          <div>السلة فارغة</div>
        </div>`;
      $("cartTotal").textContent = money(0);
      return;
    }

    $("cartItems").innerHTML = state.cart.map((item,index) => `
      <div class="cart-item">
        <img src="${escapeHTML(item.image)}"
             onerror="this.src='${fallbackImage()}'"
             alt="">
        <div class="cart-info">
          <strong>${escapeHTML(item.name)}</strong>
          <div class="cart-meta">
            ${item.color ? `اللون: ${escapeHTML(item.color)}<br>` : ""}
            ${item.size ? `المقاس: ${escapeHTML(item.size)}<br>` : ""}
            ${money(item.price)} × ${item.qty}
          </div>

          <div class="cart-line">
            <div class="qty">
              <button onclick="changeCartQty(${index},-1)">−</button>
              <span>${item.qty}</span>
              <button onclick="changeCartQty(${index},1)">+</button>
            </div>
            <button class="remove" onclick="removeCartItem(${index})">حذف</button>
          </div>
        </div>
      </div>
    `).join("");

    const total = state.cart.reduce(
      (sum,item) => sum + (Number(item.price) * Number(item.qty)), 0
    );
    $("cartTotal").textContent = money(total);
  }

  window.changeCartQty = function(index,delta){
    if(!state.cart[index]) return;
    state.cart[index].qty = Math.max(1, state.cart[index].qty + delta);
    saveCart();
    renderCart();
  };

  window.removeCartItem = function(index){
    state.cart.splice(index,1);
    saveCart();
    renderCart();
  };

  $("clearCart").addEventListener("click", () => {
    if(!state.cart.length) return;
    state.cart = [];
    saveCart();
    renderCart();
    showToast("تم إفراغ السلة");
  });

  function openCart(){
    $("cartOverlay").classList.remove("hidden");
    $("cartDrawer").classList.add("open");
    renderCart();
  }

  function closeCart(){
    $("cartDrawer").classList.remove("open");
    $("cartOverlay").classList.add("hidden");
  }

  $("cartBtn").addEventListener("click", openCart);
  $("closeCart").addEventListener("click", closeCart);
  $("cartOverlay").addEventListener("click", closeCart);

  function closeProductModal(){
    $("productModal").classList.add("hidden");
    state.modalProduct = null;
  }

  $("closeModal").addEventListener("click", closeProductModal);
  $("productModal").addEventListener("click", e => {
    if(e.target === $("productModal")) closeProductModal();
  });

  $("searchInput").addEventListener("input", e => {
    state.search = e.target.value;
    applyFilters();
  });

  $("refreshBtn").addEventListener("click", loadProducts);

  /* =========================================================
     إرسال الطلب إلى واتساب
     ========================================================= */

  function getWhatsAppNumber(){
    const saved = Number(localStorage.getItem("a_style_wa_index") || "0");
    const index = saved % WHATSAPP_NUMBERS.length;
    localStorage.setItem(
      "a_style_wa_index",
      String((index + 1) % WHATSAPP_NUMBERS.length)
    );
    return WHATSAPP_NUMBERS[index];
  }

  $("whatsappBtn").addEventListener("click", () => {
    if(!state.cart.length){
      showToast("السلة فارغة");
      return;
    }

    const lines = [
      "السلام عليكم A STYLE ❤️",
      "",
      "حابة تأكد أوردر سوا! 🥰",
      ""
    ];

    state.cart.forEach(item => {
      lines.push(
        `▪️ ${item.name}` +
        (item.color ? ` (لون: ${item.color})` : "") +
        (item.size ? ` - مقاس: ${item.size}` : "")
      );
      lines.push(`الكمية: ${item.qty} × ${money(item.price)}`);
      lines.push("");
    });

    const total = state.cart.reduce(
      (sum,item) => sum + Number(item.price) * Number(item.qty), 0
    );

    lines.push(`الإجمالي النهائي: ${money(total)}`);

    const message = encodeURIComponent(lines.join("\n"));
    const number = getWhatsAppNumber();

    window.open(`https://wa.me/${number}?text=${message}`, "_blank");
  });

  /* بداية الموقع */
  updateCartCount();
  renderCart();
  loadProducts();
</script>
</body>
</html>
