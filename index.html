<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#080808"><title>A STYLE - لوحة التحكم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#f5f5f5;color:#111}body{overflow-x:hidden}button,input,select,textarea{font-family:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-page{min-height:100vh;background:#080808;display:flex;align-items:center;justify-content:center;padding:20px}.login-card{width:100%;max-width:430px;background:#fff;border-radius:24px;padding:35px;box-shadow:0 25px 80px rgba(0,0,0,.35)}.logo{width:85px;height:85px;border-radius:22px;background:#080808;color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:24px;font-weight:bold;letter-spacing:2px}.login-card h1{text-align:center;margin:0;font-size:28px}.login-card p{text-align:center;color:#777;margin:8px 0 25px}.field{margin-bottom:16px}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #ddd;border-radius:10px;padding:13px;outline:0;background:#fff}.field input:focus,.field select:focus,.field textarea:focus{border-color:#111}.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:bold;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn-black{background:#080808;color:#fff}.btn-gray{background:#eee;color:#111}.btn-full{width:100%}.error{background:#ffeaea;color:#a00000;padding:12px;border-radius:10px;margin-bottom:15px;font-size:13px}
.app{min-height:100vh}.sidebar{position:fixed;right:0;top:0;bottom:0;width:260px;background:#080808;color:#fff;z-index:100;padding:22px 15px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:8px 8px 25px;border-bottom:1px solid #252525}.brand-logo{width:48px;height:48px;background:#fff;color:#080808;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px}.brand strong{display:block;font-size:20px;letter-spacing:2px}.brand small{color:#aaa;font-size:10px;letter-spacing:1px}.nav{margin-top:22px}.nav-btn{width:100%;border:0;background:transparent;color:#aaa;padding:14px;border-radius:10px;margin-bottom:7px;text-align:right;font-size:15px;display:flex;align-items:center;gap:12px}.nav-btn:hover,.nav-btn.active{background:#fff;color:#080808}.logout{margin-top:auto;width:100%;background:transparent;border:0;border-top:1px solid #252525;color:#aaa;padding:18px 10px 8px;text-align:right;font-size:14px}.main{margin-right:260px;min-height:100vh}.topbar{height:82px;background:#fff;border-bottom:1px solid #ddd;padding:0 30px;display:flex;align-items:center;justify-content:space-between}.topbar h1{margin:0;font-size:23px}.topbar small{color:#777}.icon-btn{width:42px;height:42px;border:1px solid #ddd;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center}.content{max-width:1400px;margin:auto;padding:28px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:20px;display:flex;align-items:center;gap:15px}.stat-icon{width:48px;height:48px;background:#080808;color:#fff;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}.stat span{display:block;color:#777;font-size:12px}.stat strong{display:block;font-size:25px;margin-top:4px}.section-head{margin:30px 0 16px;display:flex;justify-content:space-between;align-items:center;gap:15px}.section-head h2{margin:0}.section-head p{color:#777;margin:7px 0 0;font-size:13px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.search{background:#fff;border:1px solid #ddd;border-radius:10px;padding:0 12px;max-width:380px;flex:1;display:flex;align-items:center}.search input{width:100%;border:0;outline:0;padding:13px 5px;background:transparent}.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.product-card{background:#fff;border:1px solid #e5e5e5;border-radius:15px;overflow:hidden}.product-card img{width:100%;aspect-ratio:1;object-fit:cover;background:#111;display:block}.product-card-body{padding:13px}.product-card strong{display:block}.product-card span{display:block;margin-top:6px;color:#666;font-size:13px}.table-wrap{background:#fff;border:1px solid #e2e2e2;border-radius:16px;overflow:auto}table{width:100%;min-width:800px;border-collapse:collapse}th,td{padding:14px;text-align:right;border-bottom:1px solid #eee;font-size:13px}th{background:#fafafa;color:#666}.product-name{display:flex;align-items:center;gap:10px;font-weight:bold}.product-name img{width:50px;height:50px;object-fit:cover;border-radius:9px;background:#111}.badge{display:inline-block;padding:6px 10px;border-radius:30px;background:#eee;font-size:11px}.badge.active{background:#e7f7ed;color:#18723b}.actions{display:flex;gap:6px}.small-btn{width:35px;height:35px;border:1px solid #ddd;background:#fff;border-radius:8px}.orders{display:grid;gap:12px}.order{background:#fff;border:1px solid #e2e2e2;border-radius:14px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:15px}.order span,.order small{display:block;color:#777;margin-top:5px}.order select{padding:9px;border:1px solid #ddd;border-radius:8px}.empty{background:#fff;border:1px dashed #ccc;border-radius:16px;padding:50px;text-align:center;color:#777}.empty h3{color:#222;margin:12px 0 5px}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:100%;max-width:900px;max-height:94vh;overflow:auto;background:#fff;border-radius:18px}.modal-head{padding:20px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between}.modal-head h2{margin:0}.modal-body{padding:22px}.modal-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:25px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.image-upload{min-height:320px;border:2px dashed #ccc;border-radius:15px;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;color:#777;padding:10px}.image-upload img{width:100%;height:320px;object-fit:cover}.checks{margin-top:15px}.checks label{display:block;margin:10px 0;font-size:13px}.checks input{width:auto}.modal-actions{border-top:1px solid #eee;margin-top:20px;padding-top:18px;display:flex;gap:10px}.loading{min-height:100vh;background:#080808;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}.loading-logo{width:90px;height:90px;border-radius:20px;background:#fff;color:#080808;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:22px}.mobile-menu{display:none}.sidebar-overlay{display:none}
@media(max-width:1000px){.sidebar{transform:translateX(110%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-right:0}.mobile-menu{display:flex}.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90}.sidebar-overlay.show{display:block}.stats{grid-template-columns:1fr 1fr}.product-grid{grid-template-columns:1fr 1fr}.modal-grid{grid-template-columns:1fr}}@media(max-width:600px){.topbar{padding:0 15px}.topbar h1{font-size:18px}.content{padding:15px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:20px}.section-head{align-items:flex-start;flex-direction:column}.toolbar{flex-direction:column}.search{width:100%;max-width:none}.product-grid{gap:9px}.order{align-items:flex-start;flex-direction:column}.two{grid-template-columns:1fr}.modal{border-radius:14px}.login-card{padding:25px}}
</style></head><body><div id="root"></div><script>
const SUPABASE_URL="ضع_رابط_مشروع_Supabase_هنا";const SUPABASE_ANON_KEY="ضع_مفتاح_Supabase_العام_هنا";const ADMIN_EMAIL="hananamer871@gmail.com";
let db=null;if(SUPABASE_URL.startsWith("http")&&SUPABASE_ANON_KEY&&!SUPABASE_ANON_KEY.includes("ضع_مفتاح")){db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}
const root=document.getElementById("root");const state={page:"dashboard",products:[],categories:[],orders:[],loading:false,search:"",mobileMenu:false};
function money(v){return Number(v||0).toLocaleString("ar-EG")+" ج.م"}function escapeHTML(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function defaultImage(){return"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500"><rect width="100%" height="100%" fill="#111"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="70" font-family="Arial">A STYLE</text></svg>')}function logoHTML(c="brand-logo"){return`<div class="${c}">A</div>`}
function loadingScreen(){root.innerHTML='<div class="loading"><div class="loading-logo">A</div><div>جاري تحميل لوحة التحكم...</div></div>'}
function loginPage(error=""){root.innerHTML=`<div class="login-page"><form class="login-card" id="loginForm">${logoHTML("logo")}<h1>A STYLE</h1><p>تسجيل دخول لوحة التحكم</p>${!db?'<div class="error">لازم تضيفي بيانات Supabase داخل index.html أولًا.</div>':""}${error?`<div class="error">${escapeHTML(error)}</div>`:""}<div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" value="${escapeHTML(ADMIN_EMAIL)}" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required></div><button class="btn btn-black btn-full" ${!db?"disabled":""}>تسجيل الدخول</button></form></div>`;const f=document.getElementById("loginForm");if(!f)return;f.addEventListener("submit",async e=>{e.preventDefault();if(!db)return;const b=f.querySelector("button");b.disabled=true;b.textContent="جاري الدخول...";const r=await db.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(r.error){loginPage("الإيميل أو كلمة المرور غير صحيحة.");return}boot()})}
function sidebar(){return`<aside class="sidebar ${state.mobileMenu?"open":""}"><div class="brand">${logoHTML()}<div><strong>A STYLE</strong><small>ADMIN PANEL</small></div></div><div class="nav"><button class="nav-btn ${state.page==="dashboard"?"active":""}" data-page="dashboard">🏠 الرئيسية</button><button class="nav-btn ${state.page==="products"?"active":""}" data-page="products">📦 المنتجات</button><button class="nav-btn ${state.page==="orders"?"active":""}" data-page="orders">🛒 الطلبات</button></div><button class="logout" id="logout">🚪 تسجيل الخروج</button></aside><div class="sidebar-overlay ${state.mobileMenu?"show":""}" id="sidebarOverlay"></div>`}
function stats(){const totalProducts=state.products.length,activeProducts=state.products.filter(p=>p.is_active!==false).length,totalOrders=state.orders.length,pendingOrders=state.orders.filter(o=>(o.status||"pending")==="pending").length;return`<div class="stats"><div class="stat"><div class="stat-icon">📦</div><div><span>إجمالي المنتجات</span><strong>${totalProducts}</strong></div></div><div class="stat"><div class="stat-icon">✅</div><div><span>المنتجات المتاحة</span><strong>${activeProducts}</strong></div></div><div class="stat"><div class="stat-icon">🛒</div><div><span>إجمالي الطلبات</span><strong>${totalOrders}</strong></div></div><div class="stat"><div class="stat-icon">⏳</div><div><span>الطلبات المعلقة</span><strong>${pendingOrders}</strong></div></div></div>`}
function productCard(p){const i=p.image_url||p.image||defaultImage();return`<div class="product-card"><img src="${escapeHTML(i)}" alt="${escapeHTML(p.name||"منتج")}" onerror="this.src='${defaultImage()}'"><div class="product-card-body"><strong>${escapeHTML(p.name||"بدون اسم")}</strong><span>${money(p.price)}</span></div></div>`}
function orderCard(o){const s=o.status||"pending";return`<div class="order"><div><strong>طلب #${escapeHTML(o.id||"-")}</strong><span>العميل: ${escapeHTML(o.customer_name||o.name||"غير محدد")}</span><small>${escapeHTML(o.phone||o.customer_phone||"")}</small></div><div><strong>${money(o.total)}</strong><br><select data-order-status="${escapeHTML(o.id)}"><option value="pending" ${s==="pending"?"selected":""}>معلق</option><option value="processing" ${s==="processing"?"selected":""}>قيد التجهيز</option><option value="completed" ${s==="completed"?"selected":""}>مكتمل</option><option value="cancelled" ${s==="cancelled"?"selected":""}>ملغي</option></select></div></div>`}
function dashboardPage(){const ps=state.products.slice(0,8);return`${stats()}<div class="section-head"><div><h2>آخر المنتجات</h2><p>أحدث المنتجات المضافة إلى المتجر</p></div><button class="btn btn-black" id="goProducts">+ إدارة المنتجات</button></div>${ps.length?`<div class="product-grid">${ps.map(productCard).join("")}</div>`:'<div class="empty"><div style="font-size:45px">📦</div><h3>لا توجد منتجات حتى الآن</h3><p>أضيفي أول منتج من قسم المنتجات.</p></div>'}<div class="section-head"><div><h2>آخر الطلبات</h2><p>أحدث الطلبات الواردة</p></div></div>${state.orders.length?`<div class="orders">${state.orders.slice(0,5).map(orderCard).join("")}</div>`:'<div class="empty">🛒<h3>لا توجد طلبات</h3><p>عندما يصل طلب جديد سيظهر هنا.</p></div>'}`}
function productRow(p){const i=p.image_url||p.image||defaultImage(),a=p.is_active!==false;return`<tr><td><div class="product-name"><img src="${escapeHTML(i)}" onerror="this.src='${defaultImage()}'"><span>${escapeHTML(p.name||"بدون اسم")}</span></div></td><td>${money(p.price)}</td><td>${escapeHTML(p.category||"-")}</td><td><span class="badge ${a?"active":""}">${a?"متاح":"غير متاح"}</span></td><td><div class="actions"><button class="small-btn" data-edit="${escapeHTML(p.id)}">✏️</button><button class="small-btn" data-delete="${escapeHTML(p.id)}">🗑️</button></div></td></tr>`}
function productsPage(){const q=state.search.trim().toLowerCase(),ps=state.products.filter(p=>{const n=String(p.name||"").toLowerCase(),c=String(p.category||"").toLowerCase();return!q||n.includes(q)||c.includes(q)});return`<div class="section-head"><div><h2>المنتجات</h2><p>إدارة منتجات A STYLE</p></div><button class="btn btn-black" id="addProduct">＋ إضافة منتج</button></div><div class="toolbar"><div class="search">🔎<input id="productSearch" type="search" placeholder="ابحثي عن منتج..." value="${escapeHTML(state.search)}"></div></div>${ps.length?`<div class="table-wrap"><table><thead><tr><th>المنتج</th><th>السعر</th><th>التصنيف</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>${ps.map(productRow).join("")}</tbody></table></div>`:'<div class="empty">📦<h3>لا توجد منتجات</h3><p>لم يتم العثور على منتجات مطابقة.</p></div>'}`}
function ordersPage(){return`<div class="section-head"><div><h2>الطلبات</h2><p>متابعة وإدارة طلبات العملاء</p></div></div>${state.orders.length?`<div class="orders">${state.orders.map(orderCard).join("")}</div>`:'<div class="empty">🛒<h3>لا توجد طلبات حالياً</h3><p>الطلبات الجديدة ستظهر هنا تلقائياً.</p></div>'}`}
function productModal(p=null){const edit=!!p,i=p?.image_url||p?.image||"",cats=state.categories.map(c=>{const n=c.name||c;return`<option value="${escapeHTML(n)}" ${p?.category===n?"selected":""}>${escapeHTML(n)}</option>`}).join("");return`<div class="modal-bg" id="productModal"><div class="modal"><div class="modal-head"><h2>${edit?"تعديل المنتج":"إضافة منتج"}</h2><button class="icon-btn" id="closeModal">✕</button></div><form class="modal-body" id="productForm" ${edit?`data-id="${escapeHTML(p.id)}"`:""}><div class="modal-grid"><div><div class="field"><label>اسم المنتج</label><input name="name" required value="${escapeHTML(p?.name||"")}"></div><div class="two"><div class="field"><label>السعر</label><input name="price" type="number" step="0.01" value="${escapeHTML(p?.price??"")}"></div><div class="field"><label>التصنيف</label><select name="category"><option value="">بدون تصنيف</option>${cats}</select></div></div><div class="field"><label>وصف المنتج</label><textarea name="description" rows="6">${escapeHTML(p?.description||"")}</textarea></div><div class="field"><label>رابط صورة المنتج</label><input name="image_url" type="url" placeholder="https://..." value="${escapeHTML(i)}"></div><div class="checks"><label><input type="checkbox" name="is_active" ${p?.is_active!==false?"checked":""}> المنتج متاح للبيع</label></div></div><div><div class="image-upload" id="imagePreview">${i?`<img src="${escapeHTML(i)}">`:'<div>📷<br>معاينة صورة المنتج</div>'}</div></div></div><div class="modal-actions"><button type="submit" class="btn btn-black">${edit?"حفظ التعديلات":"إضافة المنتج"}</button><button type="button" class="btn btn-gray" id="cancelModal">إلغاء</button></div></form></div></div>`}
async function loadData(){if(!db)return;state.loading=true;render();try{let r=await db.from("products").select("*").order("created_at",{ascending:false});if(r.error)console.error(r.error);state.products=r.data||[];r=await db.from("categories").select("*").order("name");if(r.error)console.warn(r.error);state.categories=r.data||[];r=await db.from("orders").select("*").order("created_at",{ascending:false});if(r.error)console.warn(r.error);state.orders=r.data||[]}catch(e){console.error(e)}state.loading=false;render()}
function app(){const t=state.page==="dashboard"?"الرئيسية":state.page==="products"?"المنتجات":"الطلبات";return`<div class="app">${sidebar()}<main class="main"><header class="topbar"><div><h1>${t}</h1><small>لوحة تحكم A STYLE</small></div><button class="icon-btn mobile-menu" id="mobileMenu">☰</button></header><div class="content">${state.page==="dashboard"?dashboardPage():state.page==="products"?productsPage():ordersPage()}</div></main></div>`}
function render(){if(state.loading){loadingScreen();return}root.innerHTML=app();bindEvents()}
function bindEvents(){document.querySelectorAll(".nav-btn").forEach(b=>b.addEventListener("click",function(){state.page=this.dataset.page;state.mobileMenu=false;render()}));const mm=document.getElementById("mobileMenu");if(mm)mm.onclick=()=>{state.mobileMenu=!state.mobileMenu;render()};const ov=document.getElementById("sidebarOverlay");if(ov)ov.onclick=()=>{state.mobileMenu=false;render()};const lo=document.getElementById("logout");if(lo)lo.onclick=async()=>{if(db)await db.auth.signOut();loginPage()};const gp=document.getElementById("goProducts");if(gp)gp.onclick=()=>{state.page="products";render()};const se=document.getElementById("productSearch");if(se)se.oninput=function(){state.search=this.value;render();const x=document.getElementById("productSearch");if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length)}};const ap=document.getElementById("addProduct");if(ap)ap.onclick=()=>{root.insertAdjacentHTML("beforeend",productModal());bindModalEvents()};document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const p=state.products.find(x=>String(x.id)===String(b.dataset.edit));if(p){root.insertAdjacentHTML("beforeend",productModal(p));bindModalEvents()}});document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{const id=b.dataset.delete,p=state.products.find(x=>String(x.id)===String(id));if(!p||!confirm(`هل تريدين حذف المنتج "${p.name||""}"؟`))return;const r=await db.from("products").delete().eq("id",id);if(r.error){alert("حدث خطأ أثناء حذف المنتج.");console.error(r.error);return}await loadData()});document.querySelectorAll("[data-order-status]").forEach(s=>s.onchange=async function(){const r=await db.from("orders").update({status:this.value}).eq("id",this.dataset.orderStatus);if(r.error){alert("لم يتم تحديث حالة الطلب.");return}const o=state.orders.find(x=>String(x.id)===String(this.dataset.orderStatus));if(o)o.status=this.value;render()})}
function bindModalEvents(){const m=document.getElementById("productModal");if(!m)return;const c=document.getElementById("closeModal"),x=document.getElementById("cancelModal");if(c)c.onclick=()=>m.remove();if(x)x.onclick=()=>m.remove();const ii=document.querySelector('#productForm input[name="image_url"]'),pr=document.getElementById("imagePreview");if(ii&&pr)ii.oninput=function(){const u=this.value.trim();pr.innerHTML=u?`<img src="${escapeHTML(u)}" onerror="this.style.display='none'">`:'<div>📷<br>معاينة صورة المنتج</div>'};const f=document.getElementById("productForm");f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f),d={name:fd.get("name")?.trim()||"",price:Number(fd.get("price")||0),category:fd.get("category")||null,description:fd.get("description")||"",image_url:fd.get("image_url")||null,is_active:fd.get("is_active")==="on"};if(!d.name){alert("اكتبي اسم المنتج.");return}const id=f.dataset.id,b=f.querySelector('button[type="submit"]');b.disabled=true;b.textContent="جاري الحفظ...";const r=id?await db.from("products").update(d).eq("id",id):await db.from("products").insert(d);if(r.error){alert("حدث خطأ أثناء حفظ المنتج: "+r.error.message);b.disabled=false;b.textContent=id?"حفظ التعديلات":"إضافة المنتج";return}m.remove();await loadData()}}
async function boot(){loadingScreen();if(!db){loginPage();return}try{const {data:{session}}=await db.auth.getSession();if(!session){loginPage();return}if(session.user.email&&session.user.email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await db.auth.signOut();loginPage("هذا الحساب غير مصرح له بالدخول.");return}await loadData()}catch(e){console.error(e);loginPage("حدث خطأ أثناء الاتصال بقاعدة البيانات.")}}
boot();
</script></body></html>
