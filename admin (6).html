function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function money(v){return Number(v||0).toLocaleString("ar-EG")+" ج.م"}
function parseImages(value){
  if(!value) return [];
  if(Array.isArray(value)) return value.filter(Boolean).map(String);
  const str=String(value).trim();
  if(!str) return [];
  try{
    const parsed=JSON.parse(str);
    if(Array.isArray(parsed)) return parsed.filter(Boolean).map(String);
  }catch(e){}
  return [str];
}
function imageListForProduct(p){ return parseImages(p?.image_url); }

function compressedDataUrl(file, maxSize=1400, quality=0.78){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("تعذر قراءة الصورة."));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("تعذر تجهيز الصورة."));
      img.onload=()=>{
        const scale=Math.min(1,maxSize/Math.max(img.width,img.height));
        const canvas=document.createElement("canvas");
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function canLoadImage(url, ms=7000){
  return new Promise(resolve=>{
    const img=new Image();
    let done=false;
    const finish=ok=>{if(done)return;done=true;clearTimeout(t);img.onload=null;img.onerror=null;resolve(ok);};
    const t=setTimeout(()=>finish(false),ms);
    img.onload=()=>finish(true);
    img.onerror=()=>finish(false);
    img.src=url;
  });
}

async function ensureDefaultCategories(){
  const {data,error}=await db.from("categories").select("id,name,slug");
  if(error){ console.error(error); return; }
  const existing=new Set((data||[]).map(c=>String(c.name||"").trim()));
  const missing=defaultCategories.filter(name=>!existing.has(name));
  if(!missing.length) return;
  const rows=missing.map(name=>({name,slug:makeSlug(name)}));
  const r=await db.from("categories").insert(rows).select("id,name,slug");
  if(r.error) console.error("تعذر إنشاء الأقسام الافتراضية:",r.error);
}

async function load(){
 await ensureDefaultCategories();
 const [pr,or,cr]=await Promise.all([
  db.from("products").select("*").order("created_at",{ascending:false}),
  db.from("orders").select("*").order("created_at",{ascending:false}),
  db.from("categories").select("id,name,slug").order("name",{ascending:true})
 ]);
 if(pr.error){alert("خطأ المنتجات: "+pr.error.message);return}
 if(or.error){console.error(or.error);state.orders=[];}else state.orders=or.data||[];
 if(cr.error){
  console.error(cr.error);
  state.categories=defaultCategories.map((name,i)=>({id:null,name,slug:null}));
 }else{
  state.categories=cr.data||[];
 }
 state.products=pr.data||[];
 render();
}

 <div class="toolbar"><input class="search" id="search" value="${esc(state.search)}" placeholder="🔎 ابحثي عن منتج..."><button class="add" id="manageCategories2">🗂️ إدارة الأقسام</button><button class="add" id="add">＋ إضافة منتج</button></div>

 <section class="ordersSection" id="ordersSection"><div class="sectionHead"><h2>🛍️ الطلبات</h2><button class="refreshOrders" id="refreshOrders">↻ تحديث الطلبات</button></div>

function formatDate(v){try{return new Date(v).toLocaleString("ar-EG")}catch(e){return "—"}}
async function changeOrderStatus(id,status){
 const order=state.orders.find(o=>String(o.id)===String(id));
 const r=await db.from("orders").update({status,updated_at:new Date().toISOString()}).eq("id",id);
 if(r.error){alert("لم يتم تغيير حالة الطلب: "+r.error.message);return}
 showToast("تم تحديث حالة الطلب ✅");
 if(status==="تم الشحن" && order && order.phone){
  const phone=String(order.phone).replace(/\D/g,"");
  const egPhone=phone.startsWith("0")?"20"+phone.slice(1):phone;
  const orderNo=String(order.id||"").slice(0,8).toUpperCase();
  const msg=`أهلاً ${order.customer_name||"بك"} ❤️\n\n🚚 تم شحن طلبك بنجاح.\n📦 رقم الطلب: #${orderNo}\n💰 إجمالي الطلب: ${money(order.total)}\n\nشكرًا لتعاملك معنا 🌷`;
  window.open(`https://wa.me/${egPhone}?text=${encodeURIComponent(msg)}`,"_blank");
 }
 await load();
}
function showToast(text){const d=document.createElement("div");d.className="toast";d.textContent=text;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}

async function deleteProduct(id){
 const product=state.products.find(p=>String(p.id)===String(id));
 if(!product)return;
 const name=product.name||"هذا المنتج";
 if(!confirm(`هل أنتِ متأكدة من حذف "${name}"؟\n\nسيتم حذف المنتج من قاعدة البيانات، وبالتالي لن يظهر في صفحة المتجر لأي عميل.`))return;
 try{
   const r=await db.from("products").delete().eq("id",id);
   if(r.error){
     if(/row-level security|permission denied|not allowed|policy/i.test(r.error.message||"")){
       throw new Error("Supabase يمنع الحذف بسبب سياسة RLS. افتحي ملف SUPABASE_DELETE_POLICY.sql المرفق ونفذي الكود مرة واحدة في SQL Editor.");
     }
     throw r.error;
   }
   // حاول حذف صورة المنتج من Storage أيضًا، بدون اعتبار فشل حذف الصورة فشلًا لحذف المنتج.
   if(product.image_url){
     try{
       const marker="/storage/v1/object/public/products/";
       const idx=String(product.image_url).indexOf(marker);
       if(idx>=0){
         const path=String(product.image_url).slice(idx+marker.length).split("?")[0];
         if(path) await db.storage.from("products").remove([path]);
       }
     }catch(storageErr){ console.warn("تعذر حذف صورة المنتج من Storage:",storageErr); }
   }
   await load();
   showToast("تم حذف المنتج نهائيًا من المتجر ✅");
 }catch(err){
   console.error(err);
   alert(err.message||"تعذر حذف المنتج.");
 }
}

function render(){app()}

function makeSlug(name){
 return String(name||"").trim().toLowerCase()
   .replace(/[^\u0600-\u06FFa-z0-9]+/gi,"-")
   .replace(/^-+|-+$/g,"") || "category";
}

function categoryModal(){
 const cats=[...(state.categories||[])];
 root.insertAdjacentHTML("beforeend",`<div class="modalBg" id="categoryModal"><div class="modal">
  <div class="modalHead">
   <div><b>🗂️ إدارة الأقسام</b><div style="font-size:11px;color:#777;margin-top:4px">إضافة أو تعديل أو حذف أقسام المتجر</div></div>
   <button id="catClose">✕</button>
  </div>
  <div class="form">
   <div class="categoryAdd">
    <input id="newCategoryName" placeholder="اسم القسم الجديد">
    <button id="addCategoryBtn">＋ إضافة</button>
   </div>
   <div class="categoryList" id="categoryList"></div>
  </div>
 </div></div>`);

 const modal=document.getElementById("categoryModal");
 document.getElementById("catClose").onclick=()=>modal.remove();

 function draw(){
  const list=document.getElementById("categoryList");
  const current=state.categories||[];
  list.innerHTML=current.map(c=>`
   <div class="categoryRow">
    <div><div class="categoryName">${esc(c.name)}</div><div class="categorySlug">${esc(c.slug||makeSlug(c.name))}</div></div>
    <div class="catActions">
     <button class="act editCat" data-id="${esc(c.id)}">✏️ تعديل</button>
     <button class="act danger delCat" data-id="${esc(c.id)}">🗑️ حذف</button>
    </div>
   </div>`).join("") || '<div class="empty" style="margin:0">لا توجد أقسام.</div>';

  document.querySelectorAll(".editCat").forEach(btn=>btn.onclick=async()=>{
   const c=(state.categories||[]).find(x=>String(x.id)===String(btn.dataset.id));
   if(!c)return;
   const name=prompt("اكتبي اسم القسم الجديد:",c.name);
   if(name===null)return;
   const clean=name.trim();
   if(!clean){alert("اسم القسم لا يمكن أن يكون فارغًا.");return}
   const r=await db.from("categories").update({name:clean,slug:makeSlug(clean)}).eq("id",c.id);
   if(r.error){alert("تعذر تعديل القسم: "+r.error.message);return}
   await load(); draw(); showToast("تم تعديل القسم ✅");
  });

  document.querySelectorAll(".delCat").forEach(btn=>btn.onclick=async()=>{
   const c=(state.categories||[]).find(x=>String(x.id)===String(btn.dataset.id));
   if(!c)return;
   const used=state.products.filter(p=>String(p.category_id||"")===String(c.id)).length;
   const msg=used
    ? `القسم "${c.name}" مستخدم في ${used} منتج. عند الحذف سيتم فصل المنتجات عن القسم فقط ولن تُحذف المنتجات. هل تريدين المتابعة؟`
    : `هل تريدين حذف القسم "${c.name}"؟`;
   if(!confirm(msg))return;
   const r=await db.from("categories").delete().eq("id",c.id);
   if(r.error){alert("تعذر حذف القسم: "+r.error.message);return}
   await load(); draw(); showToast("تم حذف القسم ✅");
  });
 }

 document.getElementById("addCategoryBtn").onclick=async()=>{
  const input=document.getElementById("newCategoryName");
  const name=input.value.trim();
  if(!name){alert("اكتبي اسم القسم أولًا.");input.focus();return}
  const slug=makeSlug(name);
  const r=await db.from("categories").insert({name,slug}).select("id,name,slug").single();
  if(r.error){alert("تعذر إضافة القسم: "+r.error.message);return}
  input.value="";
  await load(); draw(); showToast("تم إضافة القسم ✅");
 };
 draw();
}

function productModal(product=null){
const cats=state.categories.length?state.categories:defaultCategories.map((name,i)=>({id:null,name,slug:null}));
const currentCategoryName=cats.find(c=>String(c.id)===String(product?.category_id))?.name || product?.category || cats[0]?.name || "";
const p={name:"",description:"",category:currentCategoryName,category_id:product?.category_id||null,price:"",old_price:"",stock:0,is_active:true,is_featured:false,image_url:"",...(product||{})};
if(!cats.length){alert("لا توجد أقسام في جدول categories. أضيفي الأقسام أولاً ثم أعيدي المحاولة.");return}
root.insertAdjacentHTML("beforeend",`<div class="modalBg" id="modal"><div class="modal"><div class="modalHead"><div><b>${product?"تعديل المنتج":"إضافة منتج جديد"}</b><div style="font-size:11px;color:#777;margin-top:4px">اختاري الصورة من الموبايل ثم احفظي</div></div><button id="close">✕</button></div><form class="form" id="productForm"><div class="two"><div>
<div class="field"><label>اسم المنتج *</label><input id="pname" required value="${esc(p.name)}"></div>
<div class="field"><label>القسم</label><select id="pcat">${cats.map(c=>`<option value="${esc(c.id||"")}" ${String(c.id||"")===String(p.category_id||"") || c.name===p.category?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
<div class="two"><div class="field"><label>السعر *</label><input id="pprice" required type="number" min="0" step=".01" value="${p.price??""}"></div><div class="field"><label>السعر القديم</label><input id="pold" type="number" min="0" step=".01" value="${p.old_price??""}"></div></div>
<div class="field"><label>المخزون</label><input id="pstock" type="number" min="0" value="${p.stock??0}"></div>
<div class="field"><label>الوصف</label><textarea id="pdesc" rows="5">${esc(p.description||"")}</textarea></div>
<div class="checks"><label><input id="pactive" type="checkbox" ${p.is_active!==false?"checked":""}> إظهار المنتج للعميل</label><br><label><input id="pfeatured" type="checkbox" ${p.is_featured?"checked":""}> منتج مميز</label></div>
</div><div><label class="upload" id="uploadBox"><span id="uploadPreview">${imageListForProduct(p).length?`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px">${imageListForProduct(p).map(u=>`<img src="${esc(u)}" style="width:100%;height:100px;object-fit:cover;border-radius:9px">`).join("")}</div>`:"📷<br>اضغطي هنا لاختيار صور المنتج"}</span><input id="pfile" type="file" accept="image/*" multiple hidden></label><div style="font-size:11px;color:#888;margin-top:7px">يمكن اختيار أكثر من صورة لنفس الموديل.</div></div></div>
<div class="saveRow"><button type="button" class="secondary" id="cancel">إلغاء</button><button class="primary" id="save">حفظ المنتج</button></div></form></div></div>`);
document.getElementById("close").onclick=closeModal;document.getElementById("cancel").onclick=closeModal;
document.getElementById("uploadBox").onclick=()=>document.getElementById("pfile").click();
document.getElementById("pfile").onchange=e=>{
  const files=[...(e.target.files||[])];
  if(!files.length)return;
  if(files.some(f=>!f.type.startsWith("image/"))){alert("اختاري صور فقط");e.target.value="";return;}
  if(files.some(f=>f.size>8*1024*1024)){alert("كل صورة يجب أن تكون أقل من 8 ميجابايت.");e.target.value="";return;}
  Promise.all(files.map(f=>new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f)})))
    .then(urls=>{
      document.getElementById("uploadPreview").innerHTML=`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px">${urls.map(u=>`<img src="${u}" alt="معاينة الصورة" style="width:100%;height:120px;object-fit:cover;border-radius:10px">`).join("")}</div><div style="font-size:11px;color:#777;margin-top:6px">تم اختيار ${urls.length} صور — سيتم حفظها كلها لنفس الموديل.</div>`;
    });
};
document.getElementById("productForm").onsubmit=async e=>{
e.preventDefault();const btn=document.getElementById("save");btn.disabled=true;btn.textContent="جاري الحفظ...";
try{
let images=imageListForProduct(p);
const files=[...(document.getElementById("pfile")?.files||[])];
if(files.length){
  if(files.some(f=>f.size>8*1024*1024))throw new Error("كل صورة يجب أن تكون أقل من 8 ميجابايت.");
  const uploaded=[];
  for(const file of files){
    const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
    const path=`${crypto.randomUUID()}.${ext}`;
    const up=await db.storage.from("products").upload(path,file,{upsert:false,contentType:file.type,cacheControl:"31536000"});
    if(up.error)throw new Error("فشل رفع الصورة: "+up.error.message);
    const publicUrl=db.storage.from("products").getPublicUrl(path).data.publicUrl;
    if(await canLoadImage(publicUrl)){
      uploaded.push(publicUrl);
    }else{
      uploaded.push(await compressedDataUrl(file));
    }
  }
  // عند اختيار صور جديدة، نستبدل صور الموديل القديمة بالصور الجديدة.
  images=uploaded;
}
const image=images[0]||null;
const productName=document.getElementById("pname").value.trim();
const slugBase=(productName||"product").toLowerCase().trim().replace(/[^\\u0600-\\u06FFa-z0-9]+/gi,"-").replace(/^-+|-+$/g,"")||"product";
const slug=product?.slug || `${slugBase}-${crypto.randomUUID().slice(0,8)}`;
const catSelect=document.getElementById("pcat");
const selectedOption=catSelect.options[catSelect.selectedIndex];
const selectedName=(selectedOption?.textContent||"").trim();
const selectedCat=cats.find(c=>String(c.name||"").trim()===selectedName) || cats.find(c=>String(c.id||"")===String(catSelect.value||""));
const payload={
 slug,
 name:productName,
 category:selectedName || selectedCat?.name || null,
 category_id:selectedCat?.id || null,
 price:Number(document.getElementById("pprice").value||0),
 old_price:document.getElementById("pold").value?Number(document.getElementById("pold").value):null,
 description:document.getElementById("pdesc").value.trim()||null,
 stock:Number(document.getElementById("pstock").value||0),
 is_active:document.getElementById("pactive").checked,
 is_featured:document.getElementById("pfeatured").checked,
 image_url:JSON.stringify(images),
 updated_at:new Date().toISOString()
};
const r=product?await db.from("products").update(payload).eq("id",product.id):await db.from("products").insert(payload);
if(r.error)throw r.error;closeModal();await load();
}catch(err){alert(err.message||"حدث خطأ");btn.disabled=false;btn.textContent="حفظ المنتج"}
};
}
function closeModal(){document.getElementById("modal")?.remove()}
async function boot(){
const {data}=await db.auth.getSession();const s=data.session;
if(!s){login();return}
if((s.user.email||"").toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await db.auth.signOut();login("هذا الحساب غير مصرح له.");return}
await load();
}
db.auth.onAuthStateChange(()=>{});
boot();
</script>
